<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Cheese — AI-powered English dictionary and reading teacher for Chinese speakers">
  <defs>
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1280" y2="400">
      <stop offset="0" stop-color="#1c1917"/>
      <stop offset=".55" stop-color="#121110"/>
      <stop offset="1" stop-color="#0c0a09"/>
    </linearGradient>
    <radialGradient id="glow" gradientUnits="userSpaceOnUse" cx="230" cy="215" r="330">
      <stop offset="0" stop-color="#f59e0b" stop-opacity=".22"/>
      <stop offset=".6" stop-color="#f59e0b" stop-opacity=".07"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="face" gradientUnits="userSpaceOnUse" x1="11" y1="17" x2="50" y2="45">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset=".55" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="title" gradientUnits="userSpaceOnUse" x1="430" y1="100" x2="430" y2="185">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <clipPath id="frame">
      <rect width="1280" height="400" rx="24"/>
    </clipPath>
    <mask id="bite" maskContentUnits="userSpaceOnUse">
      <rect x="-10" y="-10" width="84" height="84" fill="white"/>
      <circle cx="30.5" cy="31" r="5.5" fill="black"/>
    </mask>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="400" fill="url(#bg)"/>
    <rect width="1280" height="400" fill="url(#glow)"/>
    <!-- watermark wedge, top-right -->
    <g transform="translate(1000 -40) scale(6.5)" opacity=".055">
      <path d="M11 45 L50 17 L50 45 Z" fill="none" stroke="#fbbf24" stroke-width="7" stroke-linejoin="round"/>
      <circle cx="41" cy="31" r="4.5" fill="#fbbf24"/>
      <circle cx="33.5" cy="40.5" r="3" fill="#fbbf24"/>
    </g>
    <!-- scattered crumbs & twinkles -->
    <circle cx="418" cy="78" r="3" fill="#f59e0b" opacity=".35"/>
    <circle cx="906" cy="330" r="4" fill="#f59e0b" opacity=".22"/>
    <circle cx="1180" cy="270" r="3" fill="#fbbf24" opacity=".3"/>
    <circle cx="620" cy="52" r="2.5" fill="#fbbf24" opacity=".25"/>
    <path d="M1105 320 Q1105 331 1116 331 Q1105 331 1105 342 Q1105 331 1094 331 Q1105 331 1105 320 Z" fill="#fde68a" opacity=".5"/>
    <path d="M76 320 Q76 328 84 328 Q76 328 76 336 Q76 328 68 328 Q76 328 76 320 Z" fill="#fde68a" opacity=".4"/>
  </g>

  <!-- cheese wedge -->
  <g transform="translate(70 75) scale(4.5)">
    <g mask="url(#bite)">
      <path d="M11 45 L50 17 L50 45 Z" fill="url(#face)" stroke="url(#face)" stroke-width="7" stroke-linejoin="round"/>
      <path d="M14 42.5 L46 19.5" stroke="#fef08a" stroke-width="2" stroke-linecap="round" opacity=".7"/>
    </g>
    <circle cx="41" cy="31" r="4.5" fill="#b45309"/>
    <circle cx="33.5" cy="40.5" r="3" fill="#b45309"/>
    <circle cx="45" cy="41" r="2.2" fill="#b45309"/>
    <path d="M16 6 Q16 13 23 13 Q16 13 16 20 Q16 13 9 13 Q16 13 16 6 Z" fill="#fef3c7"/>
    <path d="M27 18 Q27 21.5 30.5 21.5 Q27 21.5 27 25 Q27 21.5 23.5 21.5 Q27 21.5 27 18 Z" fill="#fde68a" opacity=".9"/>
  </g>

  <!-- copy -->
  <g font-family="Geist, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">
    <text x="430" y="182" font-size="96" font-weight="800" letter-spacing="-2" fill="url(#title)">Cheese</text>
    <text x="770" y="182" font-size="40" font-weight="500" fill="#a8a29e">· English Learner</text>
    <text x="432" y="238" font-size="26" fill="#d6d3d1">An AI-powered English dictionary &amp; reading teacher</text>
    <text x="432" y="276" font-size="20" fill="#a8a29e">为中文母语者打造 · Claude 与 GPT 驱动 · 流式回答，点词即讲</text>

    <g transform="translate(432 310)">
      <rect width="204" height="44" rx="22" fill="#f59e0b" fill-opacity=".08" stroke="#f59e0b" stroke-opacity=".35"/>
      <circle cx="26" cy="22" r="5" fill="#fbbf24"/>
      <text x="44" y="29" font-size="19" fill="#fde68a">Dictionary · 词典</text>

      <g transform="translate(224 0)">
        <rect width="186" height="44" rx="22" fill="#f59e0b" fill-opacity=".08" stroke="#f59e0b" stroke-opacity=".35"/>
        <circle cx="26" cy="22" r="5" fill="#fbbf24"/>
        <text x="44" y="29" font-size="19" fill="#fde68a">Teacher · 精读</text>
      </g>
    </g>
  </g>

  <rect x="1" y="1" width="1278" height="398" rx="23" fill="none" stroke="#f59e0b" stroke-opacity=".22" stroke-width="2"/>
</svg>
